name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache da voz tugão
        uses: actions/cache@v4
        with:
          path: voz/modelo
          key: piper-tugao-medium-v2

      - name: Gerar gravações com a voz tugão (pt-PT)
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q piper-tts
          mkdir -p voz/modelo
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_PT/tug%C3%A3o/medium/pt_PT-tug%C3%A3o-medium"
          [ -f voz/modelo/tugao.onnx ] || curl -fsSL -o voz/modelo/tugao.onnx "$BASE.onnx?download=true"
          [ -f voz/modelo/tugao.onnx.json ] || curl -fsSL -o voz/modelo/tugao.onnx.json "$BASE.onnx.json?download=true"
          ls -la voz/modelo
          PYTHONIOENCODING=utf-8 python voz/gerar.py voz/modelo/tugao.onnx app/src/main/assets/voz
          du -sh app/src/main/assets/voz

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk relogio-voz.apk

      - uses: actions/upload-artifact@v4
        with:
          name: relogio-voz
          path: relogio-voz.apk

      - name: Publicar como "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest relogio-voz.apk \
            --title "Última versão (build ${{ github.run_number }})" \
            --notes "Compilado a partir de ${{ github.sha }}"
