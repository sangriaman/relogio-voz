name: Verificar vocabulario
on:
  push:
    paths: [.github/workflows/vocab.yml]
jobs:
  vocab:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          unzip -q m.zip
          find vosk-model-small-pt-0.3 -maxdepth 3 | head -40
          strings -n 2 vosk-model-small-pt-0.3/Gr.fst > words.txt; wc -l words.txt
          for w in hey ei hei ai oi tricky triki triqui trique tric trick trico tricô trigo treque tiquinho tico tique manel manuel tchau; do
            if grep -qx "$w" words.txt; then echo "SIM $w"; else echo "NAO $w"; fi
          done
          grep -E '^(tri|tre|ri)[a-z]{1,5}$' words.txt | head -80 | tr '\n' ' '
